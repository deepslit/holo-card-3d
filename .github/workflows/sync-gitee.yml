name: Sync to Gitee

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror repository to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git clone --bare "${{ github.server_url }}/${{ github.repository }}.git" repo.git
          cd repo.git
          git push --force --prune "https://deepslit:${GITEE_TOKEN}@gitee.com/deepslit/holo-card-3d.git" "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
